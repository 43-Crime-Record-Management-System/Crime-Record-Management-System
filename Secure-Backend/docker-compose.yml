services:
  eureka-server:
    build: ./Eureka-server
    image: eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./API_Gateway
    image: api-gateway
    ports:
      - "9000:9000"
    depends_on:
      - eureka-server

  auth-services:
    build: ./AuthServices
    image: auth-services
    ports:
      - "9001:9001"
    depends_on:
      - eureka-server

  criminal-services:
    build: ./CriminalServices
    image: criminal-services
    ports:
      - "9003:9003"
    depends_on:
      - eureka-server

  duty-services:
    build: ./DutyServices
    image: duty-services
    ports:
      - "9004:9004"
    depends_on:
      - eureka-server

  evidence-services:
    build: ./EvidenceServices
    image: evidence-services
    ports:
      - "9005:9005"
    depends_on:
      - eureka-server

  fir-services:
    build: ./FIRServices
    image: fir-services
    ports:
      - "9002:9002"
    depends_on:
      - eureka-server

  analytics-services:
    build: ./AnalyticsServices
    image: analytics-services
    ports:
      - "9006:9006"
    depends_on:
      - eureka-server

  frontend:
    image: secure-frontend
    container_name: secure-frontend-container
    ports:
      - "3000:80"
    depends_on:
      - api-gateway